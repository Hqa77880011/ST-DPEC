[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dualproto"
version = "0.1.0"
description = "Shape-texture dual-prototype energy implementation for open-set SEM defects"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2", "matplotlib>=3.7", "torchvision>=0.17", "Pillow>=10", "scikit-image>=0.22", "scikit-learn>=1.3"]

[project.scripts]
dualproto = "dualproto.cli:main"

[tool.setuptools.packages.find]
include = ["dualproto*"]
